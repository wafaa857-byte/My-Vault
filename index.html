<title>خزنتي</title>
<style>
:root{
  --bg:#f2f2f7;--card:#fff;--card2:#f2f2f7;--text:#1c1c1e;--sub:#8e8e93;--line:rgba(60,60,67,.16);
  --blue:#007aff;--green:#34c759;--red:#ff3b30;--orange:#ff9500;--purple:#af52de;--fill:rgba(120,120,128,.14);

}
@media (prefers-color-scheme:dark){

html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Arabic","Segoe UI",Tahoma,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;min-height:100vh}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
[data-act]{cursor:pointer;touch-action:manipulation}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
.cur{font-size:.74em;opacity:.7;font-weight:600}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{max-width:560px;margin:0 auto;padding:0 16px 120px}
.page.anim{animation:up .32s ease both}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.nav{display:flex;align-items:flex-end;justify-content:space-between;padding:20px 4px 10px;min-height:68px}
.nav h1{font-size:32px;font-weight:800;letter-spacing:-.4px;margin:0;line-height:1.15}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--blue);flex:none}
.icon-btn:active{transform:scale(.92)}
.hero{border-radius:28px;padding:22px 20px 18px;color:#fff;background:linear-gradient(140deg,#0a84ff 0%,#5e5ce6 58%,#bf5af2 100%);position:relative;overflow:hidden;box-shadow:0 14px 34px rgba(10,132,255,.25)}
.hero::after{content:"";position:absolute;width:230px;height:230px;border-radius:50%;inset-inline-end:-70px;top:-90px;background:rgba(255,255,255,.13)}
.hero .lbl{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;opacity:.92}
.hero .lbl svg{width:20px;height:20px}
.hero .bal{font-size:42px;font-weight:800;letter-spacing:-1px;margin:10px 0 18px;position:relative;z-index:1}
.hero .bal .cur{font-size:19px;opacity:.85;margin-inline-start:6px;letter-spacing:0}
.pills{display:flex;gap:8px;position:relative;z-index:1}
.pill{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 4px;border-radius:15px;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);font-weight:600;font-size:14.5px;color:#fff}
.pill svg{width:18px;height:18px}
.pill:active{transform:scale(.96)}
.card{background:var(--card);border-radius:20px;overflow:hidden;margin:12px 0}
.card.pad{padding:14px}
.sec{font-size:13px;font-weight:600;color:var(--sub);margin:22px 8px -2px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:54px;width:100%;text-align:start}
.row+.row{border-top:.5px solid var(--line)}
.row:active{background:var(--fill)}
.row.sm{min-height:46px;padding-block:8px;padding-inline-start:60px}
.row.static:active{background:none}
.ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.ic svg{width:19px;height:19px}
.grow{flex:1;min-width:0}
.t{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s{font-size:13px;color:var(--sub);margin-top:1px}
.v{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--green)}.neg{color:var(--red)}.mut{color:var(--sub)}
.plus{color:var(--blue);display:grid}
.big{font-size:30px;font-weight:800;letter-spacing:-.5px}
.hint{background:rgba(255,149,0,.14);color:var(--orange);border-radius:14px;padding:11px 14px;margin-top:12px;font-weight:600;font-size:14px}
.empty{padding:22px 14px;text-align:center;color:var(--sub);font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.tile{background:var(--card);border-radius:18px;padding:12px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:600}
.tile:active{transform:scale(.95)}
.tile .ic{width:38px;height:38px;border-radius:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.stat{background:var(--card);border-radius:18px;padding:14px}
.stat .v{font-size:20px;margin-top:4px}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--fill);color:var(--sub);white-space:nowrap}
.badge.g{background:rgba(52,199,89,.16);color:var(--green)}
.badge.o{background:rgba(255,149,0,.16);color:var(--orange)}
.badge.r{background:rgba(255,59,48,.16);color:var(--red)}
.bar{height:8px;border-radius:4px;background:var(--fill);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--blue);transition:width .6s cubic-bezier(.2,.9,.25,1)}
.top{display:flex;align-items:center;gap:12px}
.kv{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:15px;gap:12px}
.kv span:first-child{color:var(--sub)}
.kv span:last-child{font-weight:600;text-align:end}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.monthbar .ml{font-size:19px;font-weight:700}
.seg{display:flex;background:var(--fill);border-radius:11px;padding:2px;gap:2px}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:14px;font-weight:600;transition:background .2s,box-shadow .2s}
.seg button.on{background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.14)}
.btn{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:15px;background:var(--blue);color:#fff;font-weight:700;font-size:17px;margin-top:12px}
.btn:active{transform:scale(.98);opacity:.9}
.btn.tint{background:rgba(10,132,255,.14);color:var(--blue)}
.btn.red{background:rgba(255,59,48,.14);color:var(--red)}
.btn.green{background:var(--green)}
.btn.mini{height:40px;font-size:15px;border-radius:12px;margin-top:10px}
.sw{width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;transition:background .25s;flex:none;cursor:pointer}
.sw::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.3,.9,.3,1)}
.sw.on{background:var(--green)}
.sw.on::after{transform:translateX(20px)}
html[dir=rtl] .sw.on::after{transform:translateX(-20px)}
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.38);opacity:0;pointer-events:none;transition:opacity .3s;z-index:30}
#backdrop.show{opacity:1;pointer-events:auto}
#sheet{position:fixed;inset-inline:0;bottom:0;margin:0 auto;max-width:560px;z-index:31;background:var(--bg);border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.25,1);max-height:90vh;max-height:90dvh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 40px rgba(0,0,0,.2)}
#sheet.show{transform:none}
.sh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;position:sticky;top:0;background:var(--bg);z-index:2}
.sh .st{font-weight:700;font-size:17px}
.sh .lnk{color:var(--blue);font-size:17px;min-width:56px;text-align:start}
.sh .lnk.b{font-weight:700;text-align:end}
.sb{padding:0 16px 26px}
.fld{margin:12px 0}
.fld>label{display:block;font-size:13px;color:var(--sub);font-weight:600;margin:0 6px 6px}
.fld input,.fld select,.fld textarea{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:14px;border:0;background:var(--card);color:var(--text);outline:none;min-height:48px}
.fld input[type=text],.fld textarea{-webkit-appearance:none;appearance:none}
.fld input:focus,.fld textarea:focus{box-shadow:0 0 0 2px var(--blue)}
.fld.amt input{font-size:32px;font-weight:800;text-align:center;letter-spacing:-.5px;min-height:64px}
.fld textarea{min-height:150px;font-size:12.5px;direction:ltr;text-align:left;font-family:ui-monospace,Menlo,monospace;resize:none}
.fldsw{background:var(--card);border-radius:14px;margin:12px 0}
.msg{color:var(--sub);font-size:15px;line-height:1.6;padding:6px 6px 2px}
.foot{font-size:12.5px;color:var(--sub);padding:8px 10px;line-height:1.55}
.tabs{position:fixed;inset-inline:0;bottom:0;z-index:20;padding:6px 8px calc(4px + env(safe-area-inset-bottom,0px));background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(26px);backdrop-filter:saturate(180%) blur(26px);border-top:.5px solid var(--line)}
.tabs-in{display:flex;max-width:560px;margin:0 auto}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:10.5px;font-weight:600;color:var(--sub);transition:color .2s}
.tab svg{width:25px;height:25px;transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.tab.on{color:var(--blue)}
.tab.on svg{transform:scale(1.12)}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);inset-inline:0;margin:0 auto;width:max-content;max-width:90%;padding:10px 18px;border-radius:22px;background:var(--glass);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);font-weight:600;font-size:14.5px;box-shadow:0 8px 30px rgba(0,0,0,.2);transform:translateY(-160%);transition:transform .35s cubic-bezier(.2,.9,.25,1);z-index:50;pointer-events:none}
#toast.show{transform:none}
</style>
</head>

/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const toISO=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=iso=>{const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d)};
const todayISO=()=>toISO(new Date());
const curMonth=()=>todayISO().slice(0,7);
const round=n=>Math.round((n+Number.EPSILON)*100)/100;
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const diffDays=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
function addMonths(m,n){const [y,mo]=m.split('-').map(Number);const d=new Date(y,mo-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function addPeriod(iso,n,f){
  const [y,m,d]=iso.split('-').map(Number);
  if(f==='daily')return toISO(new Date(y,m-1,d+n));
  if(f==='weekly')return toISO(new Date(y,m-1,d+7*n));
  const t=new Date(y,m-1+n,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
  t.setDate(Math.min(d,last));return toISO(t);
}
function monthEnd(m){const [y,mo]=m.split('-').map(Number);return toISO(new Date(y,mo,0))}
const num=v=>{
  v=String(v==null?'':v).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[٫]/g,'.').replace(/[,٬\s]/g,'').replace(/[^\d.\-]/g,'');
  const n=parseFloat(v);return isNaN(n)?0:n;
};

/* ---------- state & storage ---------- */
function defaults(){return{v:1,settings:{lang:'ar',theme:'auto',currency:'ج.م',autoRollover:false},movements:[],entries:[],closed:{},manualOpen:{},gommiyas:[],
  inst:{car:{enabled:false,name:'',count:0,monthly:0,start:'',payments:[]},apt:{enabled:false,name:'',count:0,monthly:0,start:'',payments:[]}},loans:[]}}
function mergeData(r){
  const d=defaults();
  if(!r||typeof r!=='object')return d;
  const df=defaults();
  ['movements','entries','gommiyas','loans'].forEach(k=>{if(Array.isArray(r[k]))d[k]=r[k]});
  ['closed','manualOpen'].forEach(k=>{if(r[k]&&typeof r[k]==='object')d[k]=r[k]});
  d.gommiyas.forEach(g=>{if(!Array.isArray(g.payments))g.payments=[];let k=0;g.payments.forEach(p=>{if(p.n==null){k++;p.n=k;p.full=true}else k=Math.max(k,p.n)})});
  d.settings=Object.assign(df.settings,r.settings||{});
  d.settings.autoRollover=false;
  d.inst={car:Object.assign(df.inst.car,(r.inst||{}).car||{}),apt:Object.assign(df.inst.apt,(r.inst||{}).apt||{})};
  return d;
}
function load(){try{return mergeData(JSON.parse(localStorage.getItem(KEY)||'null'))}catch(e){return defaults()}}
let S=load();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

function t(k,p){let s=(T[L()]||T.ar)[k];if(s==null)s=T.ar[k];if(s==null)s=k;if(p)for(const x in p)s=s.replace('{'+x+'}',p[x]);return s}
const loc=()=>L()==='ar'?'ar-EG-u-nu-latn':'en-US';
const fmtN=n=>Math.abs(round(n)).toLocaleString('en-US',{maximumFractionDigits:2});
const money=(n,plus)=>`<span class="num">${n<0?'−':(plus&&n>0?'+':'')}${fmtN(n)}</span> <span class="cur">${esc(S.settings.currency)}</span>`;
const fmtDate=iso=>pd(iso).toLocaleDateString(loc(),{day:'numeric',month:'short',year:'numeric'});
const monthLabel=m=>{const [y,mo]=m.split('-').map(Number);return new Date(y,mo-1,1).toLocaleDateString(loc(),{month:'long',year:'numeric'})};
const dueText=d=>d<0?t('daysLate',{n:-d}):d===0?t('today'):t('inDays',{n:d});

const CAT={
 salary:{type:'in',ic:'briefcase',col:'#34c759'},
 realestate:{type:'in',ic:'building',col:'#5856d6'},

/* ---------- calculations ---------- */
function mcalc(m){
  const r={inc:0,household:0,personal:0,gom:0,car:0,apt:0};
  S.entries.forEach(e=>{if(e.month!==m)return;if(e.type==='in')r.inc+=e.amount;else if(e.cat==='household'||e.cat==='personal')r[e.cat]+=e.amount});
  S.gommiyas.forEach(g=>g.payments.forEach(p=>{if(p.date.slice(0,7)===m&&p.src!=='treasury')r.gom+=p.amount}));
  ['car','apt'].forEach(k=>S.inst[k].payments.forEach(p=>{if(p.date.slice(0,7)===m)r[k]+=p.amount}));
  r.ded=round(r.household+r.personal+r.gom+r.car+r.apt);
  r.inc=round(r.inc);r.rem=round(r.inc-r.ded);
  return r;
}
const treasuryBal=()=>round(S.movements.reduce((s,m)=>s+m.amount,0));
function loanCalc(l){const paid=round(l.payments.reduce((s,p)=>s+p.amount,0));return{paid,left:Math.max(0,round(l.amount-paid))}}
function loanTotals(){const r={by:0,to:0};S.loans.forEach(l=>{r[l.kind]+=loanCalc(l).left});return{by:round(r.by),to:round(r.to)}}
function gomPaidMap(g){
  const m={};
  g.payments.forEach(p=>{const n=p.n||1;const x=m[n]||(m[n]={sum:0,full:false});x.sum=round(x.sum+p.amount);if(p.full)x.full=true});
  return m;
}
function gomPaidOf(g,pm,n){const x=pm[n];return x?(x.full?g.amount:Math.min(x.sum,g.amount)):0}
function gomInfo(g){
  const pm=gomPaidMap(g);let done=0,cap=0,nextN=null;
  for(let n=1;n<=g.cycles;n++){
    const p=gomPaidOf(g,pm,n);cap+=p;
    if(p>=g.amount-0.005)done++;else if(nextN==null)nextN=n;
  }
  const nextPaid=nextN?round(gomPaidOf(g,pm,nextN)):0;
  const next=nextN?addPeriod(g.start,nextN-1,g.freq):null;
  return{paid:done,left:g.cycles-done,next,nextN,nextPaid,nextLeft:nextN?round(g.amount-nextPaid):0,days:next?diffDays(next,todayISO()):null,end:addPeriod(g.start,g.cycles-1,g.freq),
    payDate:addPeriod(g.start,(g.turn||1)-1,g.freq),payout:g.payoutAmt>0?g.payoutAmt:round(g.amount*g.cycles),pct:g.cycles&&g.amount?Math.min(100,cap/(g.amount*g.cycles)*100):0};
}
function instInfo(k){
  const I=S.inst[k],paid=I.payments.length,left=Math.max(0,I.count-paid),cm=curMonth();
  return{paid,left,leftAmt:round(left*I.monthly),paidNow:I.payments.some(p=>p.date.slice(0,7)===cm),
    end:I.start&&I.count?addMonths(I.start,I.count-1):'',pct:I.count?Math.min(100,paid/I.count*100):0,ok:I.count>0&&I.monthly>0};
}
function addMv(type,amount,date,note,loan,ref){S.movements.push({id:uid(),type,amount:round(amount),date,note:note||'',loan:loan||null,ref:ref||null,ts:Date.now()})}

/* manual rollover only: a month is posted to the treasury ONLY when the user closes it.
   This keeps the rollover movement of closed months in sync with their numbers. */
function sync(){
  S.movements=S.movements.filter(x=>x.type!=='rollover'||S.closed[x.ref]);
  /* gommiya payments taken from the treasury: rebuilt from the payments so they always match */
  S.movements=S.movements.filter(x=>x.type!=='gomPay');
  S.gommiyas.forEach(g=>{
    const grp={};
    g.payments.forEach(p=>{
      if(p.src!=='treasury')return;
      const k=(p.b||p.id)+'_'+p.date;
      const x=grp[k]||(grp[k]={k,date:p.date,amt:0,ts:p.ts||0});
      x.amt=round(x.amt+p.amount);
    });
    Object.values(grp).forEach(x=>S.movements.push({id:'gp'+x.k,type:'gomPay',amount:-x.amt,date:x.date,note:g.name,loan:null,ref:x.k,gom:g.id,ts:x.ts}));
  });
  Object.keys(S.closed).forEach(m=>{
    if(!S.closed[m])return;
    const amt=mcalc(m).rem;
    const i=S.movements.findIndex(x=>x.type==='rollover'&&x.ref===m);
    if(amt===0){if(i>=0)S.movements.splice(i,1);return}
    if(i>=0)S.movements[i].amount=amt;
    else S.movements.push({id:uid(),type:'rollover',ref:m,date:monthEnd(m),amount:amt,note:'',ts:Date.now()});
  });
}
function commit(){sync();persist();render()}
function reminders(){
  const out=[],td=todayISO();
  S.gommiyas.forEach(g=>{const i=gomInfo(g);if(i.next&&i.days<=3)out.push({ic:'users',col:'#ff9500',title:g.name+' · '+t('payInst'),sub:dueText(i.days),tone:i.days<0?'r':'o',tab:'commit',d:i.days})});
  ['car','apt'].forEach(k=>{const I=S.inst[k];if(!I.enabled)return;const ii=instInfo(k);if(ii.ok&&ii.left>0&&!ii.paidNow)out.push({ic:INSTC[k].ic,col:INSTC[k].col,title:I.name||t('inst_'+k),sub:t('dueThis'),tone:'o',tab:'commit',d:4})});
  S.loans.forEach(l=>{if(!l.due||loanCalc(l).left<=0)return;const dd=diffDays(l.due,td);if(dd<=7)out.push({ic:'swap',col:l.kind==='by'?'#ff3b30':'#34c759',title:l.person,sub:(l.kind==='by'?t('byMe'):t('toMe'))+' · '+dueText(dd),tone:dd<0?'r':'o',tab:l.kind==='by'?'debts':'credits',d:dd})});
  return out.sort((a,b)=>a.d-b.d);
}

function group(type,cat,m){

/* ---------- personal daily log & month summary ---------- */
const dayLabel=iso=>pd(iso).toLocaleDateString(loc(),{weekday:'long',day:'numeric',month:'short'});
const sumA=a=>round(a.reduce((x,e)=>x+e.amount,0));
function personalOf(m){
  const list=S.entries.filter(e=>e.month===m&&e.type==='out'&&e.cat==='personal');
  const byDay={};list.forEach(e=>{(byDay[e.date]=byDay[e.date]||[]).push(e)});
  Object.keys(byDay).forEach(d=>byDay[d].sort((a,b)=>(b.ts||0)-(a.ts||0)));
  const days=Object.keys(byDay).sort(),cm=curMonth();
  const tot=sumA(list),dim=new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
  const elapsed=m===cm?new Date().getDate():(m<cm?dim:0);
  let top=null;days.forEach(d=>{const x=sumA(byDay[d]);if(!top||x>top.s)top={d,s:x}});
  return{list,byDay,days,tot,top,avg:elapsed>0?round(tot/elapsed):0,today:m===cm?sumA(byDay[todayISO()]||[]):0};
}
function personalCard(m){
  const P=personalOf(m);
  return `<div class="card"><div class="row" role="button" data-act="personal"><div class="ic" style="background:#af52de">${icon('person')}</div><div class="grow"><div class="t">${t('c_personal')}</div><div class="s">${P.list.length?P.days.length+' '+t('spendDays'):t('dailyLog')}</div></div><div class="v">${money(P.tot)}</div><span class="mut" style="display:grid">${icon(L()==='ar'?'chevL':'chevR')}</span></div></div>`;
}

function renderTabs(){

function animateHero(){
  const el=document.getElementById('heroBal');if(!el)return;
  const to=+el.dataset.v,from=ui.lastBal;ui.lastBal=to;if(from===to)return;
  const t0=performance.now(),dur=650;
  const step=now=>{const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3),v=from+(to-from)*e;el.textContent=(v<0?'−':'')+fmtN(v);if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}
function render(anim){
  document.documentElement.lang=L();document.documentElement.dir=L()==='ar'?'rtl':'ltr';
  applyTheme();document.title=t('app');
  const V={home:vHome,month:vMonth,commit:vCommit,debts:()=>vLoans('by'),credits:()=>vLoans('to'),personal:vPersonal,set:vSet};
  $('#app').innerHTML=`<div class="page ${anim?'anim':''}">${V[ui.tab]()}</div>`;
  renderTabs();animateHero();
}

let sheetSave=null,tt=null;
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),1800)}
function openSheet(title,body,save,label,focus){
  sheetSave=save||null;const sh=$('#sheet');
  sh.innerHTML=`<div class="sh"><button class="lnk" data-act="closeSheet">${t('cancel')}</button><div class="st">${title}</div>${save?`<button class="lnk b" data-act="sheetSave">${label||t('save')}</button>`:'<span style="min-width:56px"></span>'}</div><div class="sb">${body}</div>`;
  sh.scrollTop=0;
  requestAnimationFrame(()=>{sh.classList.add('show');$('#backdrop').classList.add('show');document.body.classList.add('lock')});
  if(focus)setTimeout(()=>{const f=sh.querySelector('[data-focus]');if(f)f.focus()},380);
}
function closeSheet(){sheetSave=null;$('#sheet').classList.remove('show');$('#backdrop').classList.remove('show');document.body.classList.remove('lock')}
function form(){const o={};$('#sheet').querySelectorAll('[name]').forEach(i=>{o[i.name]=i.value});return o}

const amtFld=(label,name,val,focus)=>`<div class="fld amt"><label style="text-align:center">${label}</label><input name="${name}" type="text" inputmode="decimal" autocomplete="off" placeholder="0" value="${val?esc(val):''}" ${focus?'data-focus':''}></div>`;
const seg=(label,name,opts,val)=>`<div class="fld"><label>${label}</label><div class="seg">${opts.map(([v,l])=>`<button type="button" class="${v===val?'on':''}" data-act="seg" data-val="${v}">${l}</button>`).join('')}</div><input type="hidden" name="${name}" value="${val}"></div>`;
const swFld=(label,name,on)=>`<div class="fldsw"><div class="row static"><div class="grow t">${label}</div><div class="sw ${on?'on':''}" role="switch" data-act="swToggle"></div><input type="hidden" name="${name}" value="${on?1:0}"></div></div>`;
const delBtn=(act,id,extra)=>`<button class="btn red" data-act="${act}" data-id="${id}" ${extra||''}>${icon('trash')}${t('del')}</button>`;
function confirmSheet(title,msg,fn){openSheet(title,`<div class="msg">${msg}</div>`,null);$('#sheet .sb').insertAdjacentHTML('beforeend',`<button class="btn red" data-act="confirmDo">${icon('trash')}${t('confirm')}</button>`);confirmFn=fn}

/* entries */
function entrySheet(o){
  const ex=o.id?S.entries.find(e=>e.id===o.id):null;
  const type=ex?ex.type:o.type,cat=ex?ex.cat:(o.cat||(type==='in'?'salary':'household'));
  const cats=Object.keys(CAT).filter(k=>CAT[k].type===type);
  const defDate=ex?ex.date:((ui.tab==='month'||ui.tab==='personal')&&ui.month!==curMonth()?ui.month+'-01':todayISO());
  const body=amtFld(t('amount'),'amount',ex?ex.amount:'',!ex)
   +`<div class="fld"><label>${t('category')}</label><select name="cat">${cats.map(k=>`<option value="${k}" ${k===cat?'selected':''}>${t('c_'+k)}</option>`).join('')}</select></div>`
   +fld(t('note'),'note',ex?ex.note:'')+fld(t('date'),'date',defDate,'date')+(ex?delBtn('delEntry',ex.id):'');
  openSheet(ex?t('editEntry'):t('newEntry'),body,()=>{
    const f=form(),a=round(num(f.amount));
    if(!(a>0))return toast(t('badAmt'));
    const date=f.date||todayISO(),rec={type,cat:f.cat,amount:a,note:f.note.trim(),date,month:date.slice(0,7)};
    if(ex)Object.assign(ex,rec);else S.entries.push(Object.assign({id:uid(),ts:Date.now()},rec));
    closeSheet();commit();toast(t('savedT'));
  },null,!ex);
}

  openSheet(t('move'),body,()=>{
    const f=form(),a=round(num(f.amount));if(!(a>0))return toast(t('badAmt'));
    addMv(f.kind,f.kind==='deposit'?a:-a,f.date||todayISO(),f.note.trim());

  const body=`<div class="card pad"><div class="kv"><span>${t('curBal')}</span><span>${money(cur)}</span></div></div>`+amtFld(t('newBal'),'amount',cur||'',true);

/* gommiya */
function gomSheet(id){
  const g=id?S.gommiyas.find(x=>x.id===id):null;
  const body=fld(t('gomName'),'name',g?g.name:'')+amtFld(t('gomAmt'),'amount',g?g.amount:'',!g)
   +seg(t('freq'),'freq',[['daily',t('f_daily')],['weekly',t('f_weekly')],['monthly',t('f_monthly')]],g?g.freq:'monthly')
   +fld(t('start'),'start',g?g.start:todayISO(),'date')
   +fld(t('cycles'),'cycles',g?g.cycles:'','text','inputmode="numeric" placeholder="12"')
   +fld(t('turn'),'turn',g?g.turn:'','text','inputmode="numeric" placeholder="1"')
   +fld(t('payoutOpt'),'payout',g&&g.payoutAmt?g.payoutAmt:'','text','inputmode="decimal" placeholder="0"');
  openSheet(g?t('gomEdit'):t('gomNew'),body,()=>{
    const f=form(),a=round(num(f.amount)),cy=Math.floor(num(f.cycles));
    if(!(a>0))return toast(t('badAmt'));if(!(cy>=1))return toast(t('badAmt'));
    let turn=Math.floor(num(f.turn))||1;turn=Math.min(Math.max(1,turn),cy);
    const rec={name:f.name.trim()||t('gommiya'),amount:a,freq:f.freq,start:f.start||todayISO(),cycles:cy,turn,payoutAmt:round(num(f.payout))};
    if(g)Object.assign(g,rec);else S.gommiyas.push(Object.assign({id:uid(),payments:[],payout:null},rec));
    closeSheet();commit();toast(t('savedT'));
  },null,!g);
}
function gomDetail(id){

  const body=`<div class="card pad">
<div class="top"><div class="ic" style="background:#ff9500">${icon('users')}</div><div class="grow"><div class="t">${esc(g.name)}</div><div class="s">${money(g.amount)} · ${t('f_'+g.freq)}</div></div>${dueBadge(i)}</div>
<div class="bar"><i style="width:${i.pct}%"></i></div>
<div class="kv"><span>${t('paidN')} / ${t('leftN')}</span><span>${i.paid} / ${i.left}</span></div>
    ${i.next?`<div class="kv"><span>${t('nextDue')}</span><span>${fmtDate(i.next)}</span></div><div class="kv"><span>${t('instRemain')} (${t('instNo',{n:i.nextN})})</span><span>${money(i.nextLeft)}</span></div>`:''}
<div class="kv"><span>${t('endsOn')}</span><span>${fmtDate(i.end)}</span></div>
<div class="kv"><span>${t('payoutOn')}</span><span>${fmtDate(i.payDate)}</span></div>
<div class="kv"><span>${t('payoutAmt')}</span><span>${money(i.payout)}</span></div></div>

<div class="sec"><span>${t('payments')}</span></div>
<div class="card">${pays.length?pays.map(p=>`<div class="row" role="button" data-act="gomEditPay" data-id="${g.id}" data-p="${p.id}"><div class="grow"><div class="t" style="font-weight:500">${fmtDate(p.date)}</div><div class="s">${t('instNo',{n:p.n||1})} · ${t(p.src==='treasury'?'src_treasury':'src_month')}</div></div><div class="v">${money(p.amount)}</div><button class="plus neg" data-act="gomDelPay" data-id="${g.id}" data-p="${p.id}" aria-label="${t('del')}" style="color:var(--red)">${icon('x')}</button></div>`).join(''):`<div class="empty">${t('noPay')}</div>`}</div>
<button class="btn tint" data-act="gomEdit" data-id="${g.id}">${t('edit')}</button>

/* payment sheets: the date decides which month the payment is deducted from */
function gomPaySheet(id){
  const g=S.gommiyas.find(x=>x.id===id);if(!g)return;
  const i=gomInfo(g);if(i.left<=0||!i.nextN)return;
  const body=`<div class="card pad"><div class="kv"><span>${t('instNo',{n:i.nextN})}</span><span>${money(g.amount)}</span></div><div class="kv"><span>${t('paidN')}</span><span>${money(i.nextPaid)}</span></div><div class="kv"><span>${t('instRemain')}</span><span class="neg">${money(i.nextLeft)}</span></div></div>`
   +amtFld(t('amount'),'amount',i.nextLeft,false)+fld(t('date'),'date',todayISO(),'date')
   +seg(t('paySrc'),'src',[['month',t('src_month')],['treasury',t('src_treasury')]],'month')+`<div class="foot">${t('srcHint')}</div>`;
  openSheet(t('payInst'),body,()=>{
    const f=form(),a=round(num(f.amount));if(!(a>0))return toast(t('badAmt'));
    const date=f.date||todayISO(),pm=gomPaidMap(g),src=f.src==='treasury'?'treasury':'month',b=uid(),ts=Date.now();
    let totalLeft=0;for(let n=i.nextN;n<=g.cycles;n++)totalLeft+=round(g.amount-gomPaidOf(g,pm,n));
    if(a>round(totalLeft)+0.004)return toast(t('overpay'));
    let rest=a;
    for(let n=i.nextN;n<=g.cycles&&rest>0.004;n++){
      const room=round(g.amount-gomPaidOf(g,pm,n));
      if(room<=0)continue;
      const part=round(Math.min(rest,room));
      g.payments.push({id:uid(),date,amount:part,n,src,b,ts});
      rest=round(rest-part);
    }
    closeSheet();commit();toast(t('paidToast'));
  },null,false);
}
function gomPayEditSheet(gid,pid){
  const g=S.gommiyas.find(x=>x.id===gid);if(!g)return;
  const p=g.payments.find(x=>x.id===pid);if(!p)return;
  const body=`<div class="card pad"><div class="kv"><span>${t('instNo',{n:p.n||1})}</span><span>${money(p.amount)}</span></div></div>`
   +fld(t('date'),'date',p.date,'date')
   +seg(t('paySrc'),'src',[['month',t('src_month')],['treasury',t('src_treasury')]],p.src==='treasury'?'treasury':'month')+`<div class="foot">${t('srcHint')}</div>`;
  openSheet(t('editPayDate'),body,()=>{
    const f=form();
    p.date=f.date||p.date;p.src=f.src==='treasury'?'treasury':'month';
    closeSheet();commit();toast(t('savedT'));gomDetail(g.id);
  },null,false);
}
function instPaySheet(k){
  const I=S.inst[k],ii=instInfo(k);if(ii.left<=0)return;
  const body=amtFld(t('amount'),'amount',I.monthly,false)+fld(t('date'),'date',todayISO(),'date');
  openSheet(t('payMonth'),body,()=>{
    const f=form(),a=round(num(f.amount));if(!(a>0))return toast(t('badAmt'));
    I.payments.push({id:uid(),date:f.date||todayISO(),amount:a});
    closeSheet();commit();toast(t('paidToast'));
  },null,false);
}
/* installments */
function instSheet(k){
  const I=S.inst[k],pays=[...I.payments].sort((a,b)=>b.date.localeCompare(a.date));
  const body=fld(t('instName'),'name',I.name,'text','placeholder="'+esc(t('inst_'+k))+'"')
   +fld(t('instCount'),'count',I.count||'','text','inputmode="numeric" placeholder="12"')
   +amtFld(t('instMonthly'),'monthly',I.monthly||'',!I.count)
   +fld(t('instStart'),'start',I.start||curMonth(),'month')
   +(pays.length?`<div class="sec"><span>${t('payments')}</span></div><div class="card">${pays.map(p=>`<div class="row static"><div class="grow"><div class="t" style="font-weight:500">${fmtDate(p.date)}</div></div><div class="v">${money(p.amount)}</div><button class="plus" data-act="instDelPay" data-k="${k}" data-p="${p.id}" aria-label="${t('del')}" style="color:var(--red)">${icon('x')}</button></div>`).join('')}</div>`:'');
  openSheet(t('inst_'+k),body,()=>{
    const f=form(),cnt=Math.floor(num(f.count)),mo=round(num(f.monthly));
    if(!(cnt>=1)||!(mo>0))return toast(t('badAmt'));
    Object.assign(I,{name:f.name.trim(),count:cnt,monthly:mo,start:f.start||curMonth(),enabled:true});
    closeSheet();commit();toast(t('savedT'));
  },null,false);
}
/* loans */
function loanSheet(id,kind){
  const l=id?S.loans.find(x=>x.id===id):null;
  const body=(l?'':(kind?`<input type="hidden" name="kind" value="${kind}">`:seg(t('loanKind'),'kind',[['by',t('byMe')],['to',t('toMe')]],'by')))
   +fld(t('person'),'person',l?l.person:'')+amtFld(t('loanAmt'),'amount',l?l.amount:'',!l)
   +fld(t('loanDate'),'date',l?l.date:todayISO(),'date')+fld(t('dueDate'),'due',l?l.due||'':'','date')+fld(t('note'),'note',l?l.note:'')
   +(l?'':swFld(t('affect'),'affect',true));
  openSheet(l?t('editLoan'):t('newLoan'),body,()=>{
    const f=form(),a=round(num(f.amount)),person=f.person.trim();
    if(!person)return toast(t('person'));if(!(a>0))return toast(t('badAmt'));
    const date=f.date||todayISO();
    if(l){
      Object.assign(l,{person,amount:a,date,due:f.due||'',note:f.note.trim()});
      const mv=S.movements.find(x=>x.loan===l.id&&(x.type==='loanIn'||x.type==='loanOut'));
      if(mv){mv.amount=l.kind==='by'?a:-a;mv.date=date;mv.note=person}
    }else{
      const n={id:uid(),kind:f.kind,person,amount:a,date,due:f.due||'',note:f.note.trim(),affect:f.affect==='1',payments:[]};
      S.loans.push(n);
      if(n.affect)addMv(n.kind==='by'?'loanIn':'loanOut',n.kind==='by'?a:-a,date,person,n.id);
    }
    closeSheet();commit();toast(t('savedT'));
  },null,!l);
}
function loanDetail(id){
  const l=S.loans.find(x=>x.id===id);if(!l)return;const x=loanCalc(l);
  const pays=[...l.payments].sort((a,b)=>b.date.localeCompare(a.date));
  const body=`<div class="card pad">
<div class="top"><div class="ic" style="background:${l.kind==='by'?'#ff3b30':'#34c759'}">${icon(l.kind==='by'?'down':'up')}</div><div class="grow"><div class="t">${esc(l.person)}</div><div class="s">${l.kind==='by'?t('byMe'):t('toMe')} · ${fmtDate(l.date)}</div></div></div>
<div class="bar"><i style="width:${l.amount?Math.min(100,x.paid/l.amount*100):0}%;background:${l.kind==='by'?'var(--red)':'var(--green)'}"></i></div>
<div class="kv"><span>${t('total')}</span><span>${money(l.amount)}</span></div>
<div class="kv"><span>${t('paidSoFar')}</span><span>${money(x.paid)}</span></div>
<div class="kv"><span>${t('left')}</span><span class="${x.left>0?(l.kind==='by'?'neg':'pos'):''}">${money(x.left)}</span></div>
    ${l.due?`<div class="kv"><span>${t('dueDate')}</span><span>${fmtDate(l.due)}</span></div>`:''}
    ${l.note?`<div class="kv"><span>${t('note')}</span><span>${esc(l.note)}</span></div>`:''}</div>
    ${x.left>0?`<button class="btn" data-act="loanPay" data-id="${l.id}">${icon('plus')}${t('addPay')}</button>`:''}
<div class="sec"><span>${t('payments')}</span></div>
<div class="card">${pays.length?pays.map(p=>`<div class="row static"><div class="grow"><div class="t" style="font-weight:500">${fmtDate(p.date)}</div>${p.note?`<div class="s">${esc(p.note)}</div>`:''}</div><div class="v">${money(p.amount)}</div><button class="plus" data-act="loanDelPay" data-id="${l.id}" data-p="${p.id}" aria-label="${t('del')}" style="color:var(--red)">${icon('x')}</button></div>`).join(''):`<div class="empty">${t('noPay')}</div>`}</div>
<button class="btn tint" data-act="loanEdit" data-id="${l.id}">${t('edit')}</button>
    ${delBtn('loanDel',l.id)}`;
  openSheet(esc(l.person),body,null);
}
function loanPaySheet(id){
  const l=S.loans.find(x=>x.id===id);if(!l)return;const x=loanCalc(l);
  const body=amtFld(t('amount'),'amount',x.left,true)+fld(t('date'),'date',todayISO(),'date')+fld(t('note'),'note','');
  openSheet(t('addPay'),body,()=>{
    const f=form(),a=round(num(f.amount));if(!(a>0))return toast(t('badAmt'));
    const amt=Math.min(a,x.left),date=f.date||todayISO(),p={id:uid(),date,amount:amt,note:f.note.trim()};
    l.payments.push(p);
    if(l.affect)addMv(l.kind==='by'?'repayOut':'repayIn',l.kind==='by'?-amt:amt,date,l.person,l.id,p.id);
    closeSheet();commit();toast(t('savedT'));
  },null,true);
}
/* backup */
function exportSheet(){
  const json=JSON.stringify(S);
  openSheet(t('export'),`<div class="fld"><textarea id="expTa" readonly>${esc(json)}</textarea></div><button class="btn" data-act="copyExport">${t('copy')}</button><div class="foot">${t('backupHint')}</div>`,null);
}
function importSheet(){
  openSheet(t('import'),`<div class="fld"><textarea name="data" placeholder="${esc(t('pasteHere'))}"></textarea></div>`,()=>{
    try{
      const r=JSON.parse(form().data);
      if(!r||!Array.isArray(r.movements))throw 0;
      S=mergeData(r);closeSheet();commit();toast(t('imported'));
    }catch(e){toast(t('badData'))}
  },t('importDo'));
}

/* ---------- actions ---------- */
const H={
 tab(d){ui.tab=d.tab;render(true);window.scrollTo(0,0)},
 mprev(){ui.month=addMonths(ui.month,-1);render()},
 mnext(){ui.month=addMonths(ui.month,1);render()},
 addEntry(d){entrySheet({type:d.type,cat:d.cat})},
 editEntry(d){entrySheet({id:d.id})},
 delEntry(d){S.entries=S.entries.filter(e=>e.id!==d.id);closeSheet();commit();toast(t('deleted'))},
 treasury(d){moveSheet(d.kind)},
 setBal(){balSheet()},
 mvOpen(d){mvSheet(d.id)},
 delMv(d){S.movements=S.movements.filter(x=>x.id!==d.id);closeSheet();commit();toast(t('deleted'))},
 confirmClose(){S.closed[ui.month]=true;delete S.manualOpen[ui.month];closeSheet();commit();toast(t('rolled'))},
 summary(d){summarySheet(ui.month,d.closing==='1')},
 personal(){ui.tab='personal';render(true);window.scrollTo(0,0)},
 pAdd(){
   const a=$('#pAmt'),n=$('#pNote');if(!a)return;
   const v=round(num(a.value));if(!(v>0))return toast(t('badAmt'));
   const m=ui.month,cm=curMonth(),date=m===cm?todayISO():(m<cm?monthEnd(m):m+'-01');
   S.entries.push({id:uid(),ts:Date.now(),type:'out',cat:'personal',amount:v,note:n.value.trim(),date,month:m});
   commit();toast(t('savedT'));const x=$('#pAmt');if(x)x.focus();
 },
 reopenM(){delete S.closed[ui.month];S.manualOpen[ui.month]=true;commit()},
 gomNew(){gomSheet()},
 gomOpen(d){gomDetail(d.id)},
 gomEdit(d){gomSheet(d.id)},
 gomPay(d){gomPaySheet(d.id)},
 gomEditPay(d){gomPayEditSheet(d.id,d.p)},
 gomDelPay(d){const g=S.gommiyas.find(x=>x.id===d.id);if(!g)return;g.payments=g.payments.filter(p=>p.id!==d.p);commit();gomDetail(g.id)},
 gomPayout(d){
   const g=S.gommiyas.find(x=>x.id===d.id);if(!g)return;
   if(g.payout){S.entries=S.entries.filter(e=>e.id!==g.payout.entryId);g.payout=null}
   else{const date=todayISO(),e={id:uid(),ts:Date.now(),type:'in',cat:'extra',amount:gomInfo(g).payout,note:g.name+' · '+t('received'),date,month:date.slice(0,7)};S.entries.push(e);g.payout={date,entryId:e.id}}
   commit();gomDetail(g.id);toast(t('savedT'));
 },
 gomDel(d){const g=S.gommiyas.find(x=>x.id===d.id);if(!g)return;confirmSheet(esc(g.name),t('gomDelMsg'),()=>{
   if(g.payout)S.entries=S.entries.filter(e=>e.id!==g.payout.entryId);
   S.gommiyas=S.gommiyas.filter(x=>x.id!==g.id);closeSheet();commit();toast(t('deleted'))})},
 instToggle(d){const I=S.inst[d.k];if(!I.enabled&&!(I.count>0&&I.monthly>0)){instSheet(d.k);return}I.enabled=!I.enabled;commit()},
 instConfig(d){instSheet(d.k)},
 instPay(d){instPaySheet(d.k)},
 instDelPay(d){const I=S.inst[d.k];I.payments=I.payments.filter(p=>p.id!==d.p);commit();instSheet(d.k)},
 loanNew(d){loanSheet(null,d.k)},
 loanOpen(d){loanDetail(d.id)},
 loanEdit(d){loanSheet(d.id)},
 loanPay(d){loanPaySheet(d.id)},
 loanDelPay(d){
   const l=S.loans.find(x=>x.id===d.id);if(!l)return;
   l.payments=l.payments.filter(p=>p.id!==d.p);S.movements=S.movements.filter(m=>m.ref!==d.p);commit();loanDetail(l.id);
 },
 loanDel(d){const l=S.loans.find(x=>x.id===d.id);if(!l)return;confirmSheet(esc(l.person),t('loanDelMsg'),()=>{
   S.loans=S.loans.filter(x=>x.id!==l.id);S.movements=S.movements.filter(m=>m.loan!==l.id);closeSheet();commit();toast(t('deleted'))})},
 setLang(d){S.settings.lang=d.v;persist();render()},
 setTheme(d){S.settings.theme=d.v;persist();render()},
 exportData(){exportSheet()},
 importData(){importSheet()},
 copyExport(){
   const ta=$('#expTa');ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);
   let ok=false;try{ok=document.execCommand('copy')}catch(e){}
   if(!ok&&navigator.clipboard){navigator.clipboard.writeText(ta.value).then(()=>toast(t('copied'))).catch(()=>{});return}
   if(ok)toast(t('copied'));
 },
 resetAll(){confirmSheet(t('reset'),t('resetMsg'),()=>{const lang=S.settings;S=defaults();S.settings=lang;closeSheet();ui.month=curMonth();ui.lastBal=0;commit();})},
 confirmDo(){const f=confirmFn;confirmFn=null;if(f)f()},
 seg(d,el){el.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));el.parentElement.nextElementSibling.value=d.val},
 swToggle(d,el){el.classList.toggle('on');el.nextElementSibling.value=el.classList.contains('on')?1:0},
 closeSheet(){closeSheet()},
 sheetSave(){if(sheetSave)sheetSave()}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const fn=H[el.dataset.act];if(fn)fn(el.dataset,el,e);
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.change==='currency'){S.settings.currency=el.value.trim()||'ج.م';persist();render()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeSheet();
  if(e.key==='Enter'&&e.target&&(e.target.id==='pAmt'||e.target.id==='pNote')){e.preventDefault();H.pAdd()}
});
commit();
})();
</script>
